<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cddcf7"/>
      <stop offset="1" stop-color="#e7d8ee"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf8ef"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <g id="leaf">
      <path d="M0 0 C 14 -12 34 -10 42 2 C 30 16 10 16 0 0 Z" fill="#bfe0c4"/>
      <path d="M0 0 C 14 -6 30 -3 42 2" stroke="#9ecfa8" stroke-width="2" fill="none"/>
    </g>
    <g id="note">
      <path d="M0 26 V2 L18 -2 V20" stroke="#8fa6d8" stroke-width="4" fill="none" stroke-linecap="round"/>
      <ellipse cx="-5" cy="27" rx="7" ry="5.5" fill="#8fa6d8"/>
      <ellipse cx="13" cy="21" rx="7" ry="5.5" fill="#8fa6d8"/>
    </g>
    <g id="star">
      <path d="M0 -11 L3.2 -3.4 L11 -2.6 L5 2.6 L6.8 10.5 L0 6.4 L-6.8 10.5 L-5 2.6 L-11 -2.6 L-3.2 -3.4 Z" fill="#ffd9a3"/>
    </g>
    <g id="heart">
      <path d="M0 9 C -12 1 -9 -8 -3.5 -8 C -1.3 -8 0 -6.4 0 -5 C 0 -6.4 1.3 -8 3.5 -8 C 9 -8 12 1 0 9 Z" fill="#f6bfd0"/>
    </g>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>

  <!-- 잎사귀 테두리 -->
  <g opacity=".85">
    <use href="#leaf" x="46" y="120"/>
    <use href="#leaf" x="34" y="300" transform="rotate(18 34 300)"/>
    <use href="#leaf" x="52" y="480" transform="rotate(-12 52 480)"/>
    <use href="#leaf" x="40" y="660" transform="rotate(24 40 660)"/>
    <use href="#leaf" x="1116" y="150" transform="rotate(168 1116 150)"/>
    <use href="#leaf" x="1128" y="340" transform="rotate(196 1128 340)"/>
    <use href="#leaf" x="1112" y="530" transform="rotate(160 1112 530)"/>
    <use href="#leaf" x="1124" y="700" transform="rotate(204 1124 700)"/>
  </g>

  <use href="#star" x="150" y="90"/>
  <use href="#star" x="1050" y="120" transform="scale(.8) translate(262 30)"/>
  <use href="#star" x="980" y="690"/>
  <use href="#heart" x="230" y="700"/>
  <use href="#heart" x="1010" y="250" transform="scale(1.2) translate(-168 -42)"/>

  <!-- 제목 -->
  <text x="600" y="88" text-anchor="middle" font-size="46" font-weight="800" fill="#3c4560">HTML 한 장 뮤직 플레이어</text>
  <text x="600" y="130" text-anchor="middle" font-size="22" font-weight="600" fill="#7c85a0">파일 하나만 열면 음악이 흐릅니다</text>

  <!-- 가운데: 휴대폰 캐릭터 -->
  <g transform="translate(600 440)">
    <rect x="-135" y="-235" width="270" height="470" rx="42" fill="#ffffff" stroke="#c9d4ea" stroke-width="5"/>
    <rect x="-112" y="-205" width="224" height="224" rx="26" fill="url(#cover)"/>
    <g transform="translate(0 -93)" opacity=".9">
      <use href="#note" x="-18" y="-22" transform="scale(1.3)"/>
    </g>

    <!-- 이퀄라이저 -->
    <g fill="#ffffff" opacity=".95">
      <rect x="-74" y="-38" width="9" height="26" rx="4"/>
      <rect x="-56" y="-54" width="9" height="42" rx="4"/>
      <rect x="-38" y="-30" width="9" height="18" rx="4"/>
      <rect x="-20" y="-62" width="9" height="50" rx="4"/>
      <rect x="-2" y="-44" width="9" height="32" rx="4"/>
      <rect x="16" y="-66" width="9" height="54" rx="4"/>
      <rect x="34" y="-34" width="9" height="22" rx="4"/>
      <rect x="52" y="-50" width="9" height="38" rx="4"/>
    </g>

    <!-- 진행바 -->
    <rect x="-112" y="15" width="224" height="4" rx="2" fill="#dfe6f3"/>
    <rect x="-112" y="15" width="72" height="4" rx="2" fill="#5d6b95"/>
    <text x="-112" y="42" font-size="14" fill="#98a1b8">00:41</text>
    <text x="112" y="42" text-anchor="end" font-size="14" fill="#98a1b8">03:12</text>

    <text x="0" y="86" text-anchor="middle" font-size="23" font-weight="700" fill="#3c4560">내가 고른 노래</text>
    <text x="0" y="114" text-anchor="middle" font-size="16" fill="#7c85a0">내 컴퓨터 · 내 폴더</text>

    <!-- 재생 컨트롤 -->
    <g fill="#4a5470">
      <polygon points="-74,175 -74,205 -94,190"/>
      <rect x="-100" y="175" width="5" height="30" rx="2"/>
      <polygon points="74,175 74,205 94,190"/>
      <rect x="95" y="175" width="5" height="30" rx="2"/>
    </g>
    <circle cx="0" cy="190" r="34" fill="#ffffff" stroke="#4a5470" stroke-width="3.5"/>
    <polygon points="-10,176 -10,204 14,190" fill="#4a5470"/>

    <!-- 얼굴 -->
    <circle cx="-42" cy="-150" r="7" fill="#4a5470"/>
    <circle cx="42" cy="-150" r="7" fill="#4a5470"/>
    <path d="M-22 -124 Q0 -106 22 -124" stroke="#4a5470" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="-66" cy="-128" r="11" fill="#f8c8d4" opacity=".75"/>
    <circle cx="66" cy="-128" r="11" fill="#f8c8d4" opacity=".75"/>
  </g>

  <use href="#note" x="470" y="180" transform="rotate(-14 470 180)"/>
  <use href="#note" x="716" y="196" transform="rotate(12 716 196)"/>
  <use href="#note" x="742" y="600" transform="rotate(-8 742 600)"/>

  <!-- 왼쪽 카드: 폴더 캐릭터 -->
  <g transform="translate(105 250)">
    <rect width="290" height="200" rx="30" fill="#ffffff" stroke="#d7e3d8" stroke-width="4"/>
    <g transform="translate(42 44)">
      <path d="M0 14 A10 10 0 0 1 10 4 H40 L52 20 H96 A10 10 0 0 1 106 30 V86 A10 10 0 0 1 96 96 H10 A10 10 0 0 1 0 86 Z" fill="#bfe0c4"/>
      <circle cx="34" cy="52" r="5" fill="#4a5470"/>
      <circle cx="70" cy="52" r="5" fill="#4a5470"/>
      <path d="M44 68 Q52 76 60 68" stroke="#4a5470" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>
    <text x="176" y="80" font-size="21" font-weight="700" fill="#3c4560">폴더 끌어놓기</text>
    <text x="176" y="110" font-size="16" fill="#7c85a0">하위 폴더까지</text>
    <text x="176" y="134" font-size="16" fill="#7c85a0">알아서 찾아요</text>
    <use href="#heart" x="258" y="168"/>
  </g>

  <!-- 왼쪽 카드 2 -->
  <g transform="translate(105 490)">
    <rect width="290" height="180" rx="30" fill="#ffffff" stroke="#dce3f2" stroke-width="4"/>
    <g transform="translate(46 52)">
      <rect width="76" height="76" rx="18" fill="#cddcf7"/>
      <path d="M22 58 V22 L58 16 V50" stroke="#5d6b95" stroke-width="5" fill="none" stroke-linecap="round"/>
      <ellipse cx="17" cy="59" rx="9" ry="7" fill="#5d6b95"/>
      <ellipse cx="53" cy="52" rx="9" ry="7" fill="#5d6b95"/>
    </g>
    <text x="150" y="74" font-size="21" font-weight="700" fill="#3c4560">곡 정보 자동</text>
    <text x="150" y="104" font-size="16" fill="#7c85a0">제목 · 가수 · 표지를</text>
    <text x="150" y="128" font-size="16" fill="#7c85a0">스스로 찾아냅니다</text>
  </g>

  <!-- 오른쪽 카드 1 -->
  <g transform="translate(805 250)">
    <rect width="290" height="200" rx="30" fill="#ffffff" stroke="#e8dcef" stroke-width="4"/>
    <g transform="translate(40 60)">
      <circle cx="42" cy="42" r="42" fill="#eadff2"/>
      <g fill="#8f7fb5">
        <rect x="18" y="46" width="8" height="22" rx="4"/>
        <rect x="32" y="30" width="8" height="38" rx="4"/>
        <rect x="46" y="22" width="8" height="46" rx="4"/>
        <rect x="60" y="38" width="8" height="30" rx="4"/>
      </g>
    </g>
    <text x="150" y="82" font-size="21" font-weight="700" fill="#3c4560">소리에 맞춰</text>
    <text x="150" y="112" font-size="16" fill="#7c85a0">막대 34개가</text>
    <text x="150" y="136" font-size="16" fill="#7c85a0">실시간으로 춤춰요</text>
    <use href="#star" x="256" y="42"/>
  </g>

  <!-- 오른쪽 카드 2 -->
  <g transform="translate(805 490)">
    <rect width="290" height="180" rx="30" fill="#ffffff" stroke="#f2e3d8" stroke-width="4"/>
    <g transform="translate(46 48)">
      <circle cx="40" cy="40" r="38" fill="#ffe6cc"/>
      <path d="M24 40 A16 16 0 0 1 56 40" stroke="#e2a86a" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M14 40 A26 26 0 0 1 66 40" stroke="#e2a86a" stroke-width="5" fill="none" stroke-linecap="round" opacity=".6"/>
      <circle cx="40" cy="52" r="6" fill="#e2a86a"/>
      <line x1="16" y1="16" x2="64" y2="64" stroke="#ef9a9a" stroke-width="6" stroke-linecap="round"/>
    </g>
    <text x="150" y="74" font-size="21" font-weight="700" fill="#3c4560">인터넷 없어도</text>
    <text x="150" y="104" font-size="16" fill="#7c85a0">설치도 서버도</text>
    <text x="150" y="128" font-size="16" fill="#7c85a0">필요 없습니다</text>
  </g>

  <!-- 하단 띠 -->
  <g transform="translate(600 742)">
    <rect x="-330" y="-30" width="660" height="56" rx="28" fill="#ffffff" stroke="#dbe4f2" stroke-width="3"/>
    <text x="0" y="6" text-anchor="middle" font-size="19" font-weight="600" fill="#5d6b95">HTML · CSS · JavaScript · Web Audio API · ID3 태그 파서 직접 구현</text>
  </g>
</svg>
