<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dbe3f5">
<title>Music Player</title>
<style>
/* =========================================================
   Now Playing — 첨부 레퍼런스 스타일
   블러 처리된 아트워크 배경 · 풀블리드 커버 · 페리윙클 파스텔
   ========================================================= */

:root {
    --ink:    #2b3040;      /* 제목 · 아이콘 */
    --ink-2:  #656b7d;      /* 아티스트 · 시간 */
    --ink-3:  #9aa0b0;      /* 보조 */
    --line:   rgba(43, 48, 64, .16);
    --card:   rgba(255, 255, 255, .58);
    --fab:    rgba(255, 255, 255, .82);
    --radius: 30px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }
body { height: 100dvh; }        /* 모바일 주소창 높이 변화 대응 (미지원 시 위 100% 사용) */

body {
    font-family: 'Pretendard', -apple-system, 'Segoe UI Variable', 'Segoe UI',
                 'Malgun Gothic', system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(165deg, #e4ebfa 0%, #cdd8ef 42%, #e7e4f4 100%);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
}

/* ---------- 아트워크 블러 배경 ---------- */

#bg, #bgTint { position: fixed; inset: 0; pointer-events: none; }
#bg {
    inset: -12%;
    background-size: cover;
    background-position: center;
    filter: blur(48px) saturate(1.35);
    transform: scale(1.18);
    opacity: 0;
    transition: opacity .5s ease;
}
#bg.on { opacity: 1; }
#bgTint {
    background: linear-gradient(180deg, rgba(255,255,255,.24) 0%,
                                        rgba(255,255,255,.46) 55%,
                                        rgba(255,255,255,.66) 100%);
}

/* ---------- 무대 ---------- */

.stage {
    position: relative;
    width: min(460px, 100%);
    height: 100%;
    margin: 0 auto;
    overflow: hidden;
}

@media (min-width: 520px) and (min-height: 620px) {
    body { display: flex; align-items: center; justify-content: center; padding: 26px 0; }
    .stage {
        height: min(100%, 880px);
        border-radius: var(--radius);
        background: rgba(255, 255, 255, .26);
        box-shadow: 0 44px 90px -46px rgba(40, 50, 85, .55),
                    0 0 0 1px rgba(255, 255, 255, .5) inset;
        backdrop-filter: blur(3px);
    }
}

/* ---------- 뷰 전환 (재생화면 ↔ 재생목록) ---------- */

.view {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    transition: transform .4s cubic-bezier(.32, .72, 0, 1), opacity .3s ease;
}
.view-list { transform: translateY(100%); opacity: 0; pointer-events: none; }
body.list-open .view-now  { transform: translateY(-7%); opacity: 0; pointer-events: none; }
body.list-open .view-list { transform: none; opacity: 1; pointer-events: auto; }

/* ---------- 아이콘 ---------- */

.ic {
    width: 1em; height: 1em; display: block;
    fill: none; stroke: currentColor; stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round;
}

button {
    font: inherit; color: inherit; background: none; border: 0;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
}

/* ---------- 상단 바 ---------- */

.topbar {
    display: flex; justify-content: flex-end;
    padding: 14px 14px 6px;
    flex: none;
}
.tb-btn {
    width: 40px; height: 40px; border-radius: 12px;
    font-size: 22px; color: var(--ink);
    transition: background .15s ease;
}
.tb-btn:hover { background: rgba(255,255,255,.5); }

/* ---------- 커버 ---------- */

.art-wrap { position: relative; flex: none; }

/* aspect-ratio는 스크립트가 높이를 실측하기 전까지의 기본값이다.
   fitArt()가 남은 세로 공간을 재서 height를 직접 지정한다. */
.art {
    position: relative;
    width: 100%; aspect-ratio: 1 / 1;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    background: linear-gradient(150deg, #d9e2f6, #c6d2ec);
}
.art img { width: 100%; height: 100%; object-fit: cover; display: block; }
#artIcon { font-size: 62px; color: rgba(255,255,255,.85); stroke-width: 1.2; }

/* 재생 중에만 커버 하단에 옅게 뜨는 스펙트럼 (레퍼런스에는 없는 요소 —
   지우려면 아래 .wave 블록과 #wave 엘리먼트만 삭제하면 된다) */
.wave {
    position: absolute; left: 0; right: 0; bottom: 3px;
    height: 46px; padding: 0 12px;
    display: flex; align-items: flex-end; justify-content: center; gap: 3px;
    opacity: 0; transition: opacity .45s ease; pointer-events: none;
}
body.playing .wave { opacity: .58; }
.wave i {
    flex: 1 1 0; max-width: 5px; height: 6%;
    background: rgba(255,255,255,.92);
    border-radius: 3px 3px 0 0;
    transition: height 70ms linear;
}

/* ---------- 진행바 ---------- */

.progress {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 3px; background: rgba(255,255,255,.5);
    cursor: pointer; touch-action: none;
}
.progress::before { content: ''; position: absolute; inset: -16px 0; }
.progress-fill { height: 100%; width: 0; background: var(--ink); }
.progress-knob {
    position: absolute; top: 50%; left: 0;
    width: 2px; height: 15px; margin-left: -1px;
    background: var(--ink); transform: translateY(-50%);
}

.times {
    display: flex; justify-content: space-between;
    padding: 11px 18px 0;
    font-size: 12px; font-weight: 500; color: var(--ink-2);
    font-variant-numeric: tabular-nums;
    flex: none;
}

/* ---------- 곡 정보 ---------- */

.meta { text-align: center; padding: 26px 30px 0; flex: none; }
.meta h1 {
    font-size: 19px; font-weight: 700; letter-spacing: -.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.meta p {
    margin-top: 7px; font-size: 13px; color: var(--ink-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ---------- ⋯ / ♡ / ☰ ---------- */

.util {
    display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: center;
    padding: 26px 26px 0; flex: none;
}
.util button { width: 40px; height: 40px; font-size: 21px; color: var(--ink); }
.util button:nth-child(1) { justify-self: start; }
.util button:nth-child(2) { justify-self: center; }
.util button:nth-child(3) { justify-self: end; }
#heartBtn.on { color: #e2668a; }
#heartBtn.on .ic { fill: currentColor; stroke: currentColor; }

/* ---------- 트랜스포트 ---------- */

.spacer { flex: 1 1 auto; min-height: 6px; }

.transport {
    display: flex; align-items: center; justify-content: center;
    gap: 22px; padding: 0 18px; flex: none;
}
.tr-side {
    width: 42px; height: 42px; border-radius: 13px;
    font-size: 19px; color: var(--ink-2);
    transition: background .15s ease, color .15s ease;
}
.tr-side:hover { background: rgba(255,255,255,.55); }
.tr-side.on { color: var(--ink); background: rgba(255,255,255,.72); }

#repeatBtn { position: relative; }
#repeatBtn.one::after {
    content: '1'; position: absolute; top: 4px; right: 5px;
    font-size: 9px; font-weight: 800; line-height: 1;
    color: var(--ink);
}

.tr-step { width: 46px; height: 46px; font-size: 26px; color: var(--ink); }
.tr-step:active { transform: scale(.92); }

.play {
    width: 60px; height: 60px; border-radius: 50%;
    border: 1.6px solid var(--ink); color: var(--ink); font-size: 22px;
    background: rgba(255,255,255,.28);
    transition: transform .15s ease, background .15s ease;
}
.play:hover  { background: rgba(255,255,255,.6); }
.play:active { transform: scale(.94); }

/* ---------- 하단 배지 ---------- */

.footer {
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 20px 20px; flex: none;
    min-height: 62px;
}
.badge {
    font-size: 10px; font-weight: 700; letter-spacing: .06em;
    padding: 4px 8px; border-radius: 5px;
    border: 1px solid var(--line); color: var(--ink-2);
    background: rgba(255,255,255,.5);
}
.badge:empty { display: none; }

/* ---------- 플로팅 버튼 ---------- */

.fabs {
    position: absolute; right: 14px; bottom: 116px; z-index: 5;
    display: flex; flex-direction: column; gap: 12px;
}
.fab {
    width: 50px; height: 50px; border-radius: 17px;
    background: var(--fab); color: var(--ink); font-size: 21px;
    box-shadow: 0 10px 22px -10px rgba(40, 50, 85, .5);
    transition: transform .15s ease, background .15s ease;
}
.fab:hover  { background: #fff; transform: translateY(-1px); }
.fab:active { transform: translateY(0) scale(.95); }
body.list-open .fabs { opacity: 0; pointer-events: none; }

/* ---------- 재생목록 ---------- */

.lst-top {
    display: flex; align-items: center; gap: 10px;
    padding: 16px 14px 10px; flex: none;
}
.lst-title { flex: 1; font-size: 15px; font-weight: 700; }
.lst-title span { font-weight: 500; color: var(--ink-3); margin-left: 6px; font-size: 13px; }

#searchBox {
    margin: 0 16px 10px; padding: 10px 15px; flex: none;
    border: 1px solid var(--line); border-radius: 14px;
    background: rgba(255,255,255,.7); font-size: 14px; color: var(--ink);
    outline: none;
}
#searchBox::placeholder { color: var(--ink-3); }
#searchBox:focus { border-color: rgba(43,48,64,.4); }
#searchBox.hidden-box { display: none; }

#trackList {
    flex: 1; overflow-y: auto; overscroll-behavior: contain;
    padding: 0 10px 8px;
}
#trackList::-webkit-scrollbar { width: 6px; }
#trackList::-webkit-scrollbar-thumb { background: rgba(43,48,64,.18); border-radius: 3px; }

.row {
    display: flex; align-items: center; gap: 12px;
    padding: 9px 10px; border-radius: 16px; cursor: pointer;
    transition: background .15s ease;
}
.row:hover { background: rgba(255,255,255,.55); }
.row.active { background: rgba(255,255,255,.78); }
.row.active .row-title { color: #4a5fa8; }

.row-art {
    width: 46px; height: 46px; border-radius: 12px; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; color: rgba(255,255,255,.95);
    overflow: hidden;
}
.row-body { flex: 1; min-width: 0; }
.row-title {
    font-size: 14px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.row-artist {
    font-size: 12px; color: var(--ink-2); margin-top: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.row-dur { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; flex: none; }
.row-fav { width: 32px; height: 32px; font-size: 16px; color: var(--ink-3); flex: none; }
.row-fav.on { color: #e2668a; }
.row-fav.on .ic { fill: currentColor; stroke: currentColor; }

.empty { padding: 40px 20px; text-align: center; font-size: 13px; color: var(--ink-2); }

/* 재생목록 하단 미니 플레이어 */
.mini {
    display: flex; align-items: center; gap: 11px; flex: none;
    margin: 0 12px 12px; padding: 9px 12px;
    border-radius: 20px; background: rgba(255,255,255,.72);
    box-shadow: 0 12px 26px -16px rgba(40, 50, 85, .6);
}
.mini-art {
    width: 40px; height: 40px; border-radius: 12px; flex: none; overflow: hidden;
    background: linear-gradient(150deg, #d9e2f6, #c6d2ec);
}
.mini-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mini-meta { flex: 1; min-width: 0; cursor: pointer; }
.mini-meta h4 {
    font-size: 13px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.mini-meta p {
    font-size: 11px; color: var(--ink-2); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.mini button { width: 34px; height: 34px; font-size: 19px; color: var(--ink); flex: none; }
.mini .mini-play { font-size: 16px; border: 1.4px solid var(--ink); border-radius: 50%; }

/* ---------- 첫 화면 (내 음악 불러오기) ---------- */

.overlay {
    position: absolute; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center; padding: 22px;
    background: rgba(240, 244, 253, .78); backdrop-filter: blur(14px);
}
.overlay[hidden] { display: none; }
.ov-card {
    width: 100%; text-align: center; padding: 40px 28px;
    border-radius: 28px; background: rgba(255,255,255,.72);
    border: 1px solid rgba(255,255,255,.9);
    box-shadow: 0 26px 54px -30px rgba(40, 50, 85, .5);
}
.ov-card .ic { margin: 0 auto; font-size: 46px; color: #6f7fb8; stroke-width: 1.3; }
.ov-card h2 { font-size: 19px; font-weight: 700; margin: 18px 0 9px; }
.ov-card p  { font-size: 13px; line-height: 1.7; color: var(--ink-2); }
.ov-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 24px 0 16px; }
.ov-hint { font-size: 11px; color: var(--ink-3); }

.btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 11px 19px; border-radius: 9999px;
    border: 1px solid var(--line); background: rgba(255,255,255,.8);
    font-size: 13.5px; font-weight: 600; color: var(--ink);
    transition: background .15s ease, transform .15s ease;
}
.btn .ic { font-size: 17px; margin: 0; color: inherit; stroke-width: 1.9; }
.btn:hover { background: #fff; transform: translateY(-1px); }
.btn-primary {
    border-color: transparent; color: #fff;
    background: linear-gradient(145deg, #8b9dd4, #6c7fbe);
    box-shadow: 0 10px 22px -10px rgba(90, 108, 170, .8);
}
.btn-primary .ic { color: #fff; }
.btn-primary:hover { background: linear-gradient(145deg, #97a8dc, #7688c6); }

/* ---------- 드래그 · 토스트 ---------- */

.dragveil {
    position: absolute; inset: 10px; z-index: 30; display: none;
    align-items: center; justify-content: center;
    border: 2.5px dashed #7d8dc8; border-radius: 24px;
    background: rgba(190, 203, 238, .42); backdrop-filter: blur(3px);
    font-size: 15px; font-weight: 700; color: #4a5891;
    pointer-events: none;
}
body.is-drag .dragveil { display: flex; }

#toast {
    position: absolute; left: 50%; bottom: 26px; z-index: 40;
    transform: translate(-50%, 14px);
    padding: 10px 20px; border-radius: 9999px;
    background: rgba(38, 43, 60, .9); color: #fff;
    font-size: 12.5px; font-weight: 600;
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- 세로 공간이 좁을 때 ---------- */

@media (max-height: 760px) {
    .meta  { padding-top: 20px; }
    .util  { padding-top: 20px; }
    .art   { aspect-ratio: 4 / 3.1; }   /* fitArt() 실행 전 기본값 */
    .fabs  { bottom: 104px; }
}
@media (max-height: 620px) {
    .art    { aspect-ratio: 16 / 9; }
    .wave   { height: 34px; }
    .footer { min-height: 50px; padding: 16px 20px 16px; }
    .fabs   { bottom: 92px; }
}
</style>
</head>
<body>

<!-- ===== 아이콘 스프라이트 ===== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-chev-down" viewBox="0 0 24 24"><polyline points="5 9 12 16 19 9"/></symbol>
    <symbol id="i-chev-up" viewBox="0 0 24 24"><polyline points="5 15 12 8 19 15"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.7" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.6 5.1a5.2 5.2 0 0 0-7.4 0L12 6.3l-1.2-1.2a5.2 5.2 0 1 0-7.4 7.4l1.2 1.2L12 21.1l7.4-7.4 1.2-1.2a5.2 5.2 0 0 0 0-7.4z"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><line x1="9" y1="6" x2="21" y2="6"/><line x1="9" y1="12" x2="21" y2="12"/><line x1="9" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1.4" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1.4" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><polyline points="17 2 21 6 17 10"/><path d="M3 12V9a3 3 0 0 1 3-3h15"/><polyline points="7 22 3 18 7 14"/><path d="M21 12v3a3 3 0 0 1-3 3H3"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><polyline points="17 3 21 3 21 7"/><line x1="3" y1="21" x2="21" y2="3"/><polyline points="21 17 21 21 17 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="3" y1="3" x2="9" y2="9"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><rect x="2.5" y="5" width="1.9" height="14" rx=".9" fill="currentColor" stroke="none"/><polygon points="13 5 13 19 6 12" fill="currentColor" stroke="none"/><polygon points="21.5 5 21.5 19 14.5 12" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><rect x="19.6" y="5" width="1.9" height="14" rx=".9" fill="currentColor" stroke="none"/><polygon points="11 5 11 19 18 12" fill="currentColor" stroke="none"/><polygon points="2.5 5 2.5 19 9.5 12" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><polygon points="7 4 20 12 7 20" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="4.5" width="4" height="15" rx="1.3" fill="currentColor" stroke="none"/><rect x="13.5" y="4.5" width="4" height="15" rx="1.3" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16" y2="16"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></symbol>
</svg>

<div id="bg"></div>
<div id="bgTint"></div>

<div class="stage">

    <!-- ===== 재생 화면 ===== -->
    <section class="view view-now">

        <div class="topbar">
            <button id="collapseBtn" class="tb-btn" title="재생목록 (L)"><svg class="ic"><use href="#i-chev-down"/></svg></button>
        </div>

        <div class="art-wrap">
            <div id="art" class="art">
                <svg id="artIcon" class="ic"><use href="#i-music"/></svg>
            </div>
            <div id="wave" class="wave"></div>
            <div id="progress" class="progress">
                <div id="progressFill" class="progress-fill"></div>
                <div id="progressKnob" class="progress-knob"></div>
            </div>
        </div>

        <div class="times">
            <span id="curTime">00:00</span>
            <span id="durTime">00:00</span>
        </div>

        <div class="meta">
            <h1 id="npTitle">재생할 곡을 선택하세요</h1>
            <p id="npArtist">—</p>
        </div>

        <div class="util">
            <button id="moreBtn" title="음악 불러오기 (O)"><svg class="ic"><use href="#i-more"/></svg></button>
            <button id="heartBtn" title="좋아요"><svg class="ic"><use href="#i-heart"/></svg></button>
            <button id="listBtn" title="재생목록 (L)"><svg class="ic"><use href="#i-list"/></svg></button>
        </div>

        <div class="spacer"></div>

        <div class="transport">
            <button id="repeatBtn" class="tr-side on" title="반복"><svg class="ic"><use href="#i-repeat"/></svg></button>
            <button id="prevBtn" class="tr-step" title="이전 곡 (←)"><svg class="ic"><use href="#i-prev"/></svg></button>
            <button id="playBtn" class="play" title="재생 / 일시정지 (Space)"><svg id="playIcon" class="ic"><use href="#i-play"/></svg></button>
            <button id="nextBtn" class="tr-step" title="다음 곡 (→)"><svg class="ic"><use href="#i-next"/></svg></button>
            <button id="shuffleBtn" class="tr-side on" title="셔플"><svg class="ic"><use href="#i-shuffle"/></svg></button>
        </div>

        <div class="footer">
            <span id="fmtBadge" class="badge"></span>
        </div>

        <div class="fabs">

            <button id="searchFab" class="fab" title="검색"><svg class="ic"><use href="#i-search"/></svg></button>
        </div>
    </section>

    <!-- ===== 재생목록 ===== -->
    <section class="view view-list">

        <div class="lst-top">
            <button id="closeList" class="tb-btn" title="재생화면으로"><svg class="ic"><use href="#i-chev-up"/></svg></button>
            <div class="lst-title">재생목록<span id="trackCount"></span></div>
            <button id="searchBtn" class="tb-btn" title="검색"><svg class="ic" style="font-size:20px"><use href="#i-search"/></svg></button>
            <button id="libBtn" class="tb-btn" title="음악 불러오기 (O)"><svg class="ic" style="font-size:20px"><use href="#i-folder"/></svg></button>
        </div>

        <input id="searchBox" class="hidden-box" placeholder="곡 · 아티스트 검색">

            <div id="mArt" class="mini-art"></div>
            <div class="mini-meta" id="miniMeta">
                <h4 id="mTitle">—</h4>
                <p id="mArtist">—</p>
            </div>

            <button id="mPlay" class="mini-play"><svg id="mPlayIcon" class="ic"><use href="#i-play"/></svg></button>
            <button id="mNext"><svg class="ic"><use href="#i-next"/></svg></button>
        </div>

    <!-- ===== 첫 화면 ===== -->
    <div id="overlay" class="overlay" >
        <div class="ov-card">
            <svg class="ic"><use href="#i-folder"/></svg>
            <h2>음악을 불러오세요</h2>
            <p>폴더나 오디오 파일을 이 창에 끌어다 놓아도 됩니다.<br>
               파일은 이 브라우저 안에서만 재생되며 어디에도 업로드되지 않습니다.</p>
            <div class="ov-btns">
                <button id="pickFolder" class="btn btn-primary"><svg class="ic"><use href="#i-folder"/></svg>폴더 열기</button>
                <button id="pickFiles" class="btn"><svg class="ic"><use href="#i-plus"/></svg>파일 선택</button>

</div>

<audio id="audio" preload="metadata"></audio>

<input id="fileInput"   type="file" multiple accept="audio/*,.mp3,.m4a,.ogg,.wav,.flac,.aac" hidden>
<input id="folderInput" type="file" multiple webkitdirectory directory hidden>

<!-- 같은 폴더에 놓인 오디오 파일 목록. title / artist 를 채우면 그 값이 곡 정보로 쓰인다.
     파일을 추가하려면 이 배열에 파일명만 넣으면 된다. -->


<!-- 내장 오디오: type이 JS가 아니므로 실행되지 않고 base64 텍스트만 보관한다.
     data-title / data-artist 를 채우면 그 값이 곡 정보로 쓰인다. -->


<script>
(() => {
'use strict';

const AUDIO_EXT = /\.(mp3|m4a|ogg|wav|flac|aac)$/i;
const BAR_COUNT = 34;
const MP3_DIR   = 'mp3/';          // http(s)로 열었을 때만 쓰는 자동 스캔 경로

const $ = id => document.getElementById(id);
const audio = $('audio');

let tracks    = [];     // {name, fileObj, url, title, artist, tint, duration, art, fmt}
let current   = -1;
let shuffle   = true;
let repeat    = 'all';  // 'all' | 'one' | 'off'
let scanToken = 0;      // 라이브러리 교체 시 이전 백그라운드 스캔을 무효화
let artUrl    = null;   // 현재 곡 앨범아트 objectURL (한 번에 하나만 유지)
const favs    = new Set();

/* ---------- 커버 대체색 ---------- */

const TINTS = [
    'linear-gradient(150deg, #b9c6ea, #97a9db)',
    'linear-gradient(150deg, #ccc3e8, #a99ed6)',
    'linear-gradient(150deg, #b6cfe4, #8fb3d3)',
    'linear-gradient(150deg, #d5c6dd, #b2a0c8)',
];

// "Artist - Title.mp3" 형태면 분리하고, 아니면 파일명을 제목으로 쓴다.
function fromFileName(name) {
    const base = name.replace(/\.[^.]+$/, '');
    const m = base.match(/^\s*(.+?)\s+-\s+(.+?)\s*$/);
    return m ? { artist: m[1], title: m[2] } : { artist: '', title: base };
}

function formatOf(name) {
    const ext = (name.match(/\.([^.]+)$/) || [, ''])[1].toLowerCase();
    return ({ mp3: 'MP3', m4a: 'AAC', aac: 'AAC', ogg: 'OGG', wav: 'WAV', flac: 'FLAC' })[ext] || '';
}

function makeTrack(i, { name, url, fileObj = null, title, artist }) {
    const guess = fromFileName(name);
    return {
        name, url, fileObj,
        title:  title  || guess.title,
        artist: artist || guess.artist || 'Unknown Artist',
        tint: TINTS[i % TINTS.length],
        fmt: formatOf(name),
        duration: null,
        art: null,          // {off, len, mime} — 재생 시점에 blob으로 잘라 쓴다
    };
}

/* ---------- 1. 라이브러리 불러오기 ---------- */

function setLibrary(files, { quiet = false, autostart = false } = {}) {
    const audioFiles = [...files].filter(f => AUDIO_EXT.test(f.name));
    if (!audioFiles.length) { toast('재생 가능한 오디오 파일이 없습니다.'); return; }

    audioFiles.sort((a, b) => pathOf(a).localeCompare(pathOf(b), 'ko', { numeric: true }));

    releaseLibrary();
    tracks = audioFiles.map((f, i) => makeTrack(i, {
        name: f.name, url: URL.createObjectURL(f), fileObj: f,
        title: f._title, artist: f._artist,
    }));
    current = -1;
    resetNowPlaying();
    renderList();
    $('overlay').hidden = true;
    if (!quiet) toast(`${tracks.length}곡을 불러왔습니다.`);
    scanMetadata();
    if (autostart) beginPlayback();
}

// 파일이 아니라 상대경로로 참조하는 곡(문서에 심어둔 재생목록 · 서버 스캔 결과)
function adoptPathTracks(list, { autostart = false } = {}) {
    releaseLibrary();
    tracks = list.map((t, i) => makeTrack(i, {
        name: t.file.split('/').pop(),
        url: encodeURI(t.file),
        title: t.title, artist: t.artist,
    }));
    current = -1;
    resetNowPlaying();
    renderList();
    $('overlay').hidden = true;
    scanMetadata();
    if (autostart) beginPlayback();
}

function pathOf(f) { return f.webkitRelativePath || f._path || f.name; }

function releaseLibrary() {
    scanToken++;
    tracks.forEach(t => { if (t.fileObj) URL.revokeObjectURL(t.url); });
    setArt(null);
    audio.pause();
    audio.removeAttribute('src');
    audio.load();
}

$('fileInput').addEventListener('change', e => { setLibrary(e.target.files); e.target.value = ''; });
$('folderInput').addEventListener('change', e => { setLibrary(e.target.files); e.target.value = ''; });

const openFolder = () => $('folderInput').click();
const openFiles  = () => $('fileInput').click();
$('pickFolder').addEventListener('click', openFolder);
$('pickFiles').addEventListener('click', openFiles);
$('libBtn').addEventListener('click', openFolder);
$('moreBtn').addEventListener('click', openFolder);

/* ---------- 2. 드래그 앤 드롭 (폴더 포함) ---------- */

let dragDepth = 0;

window.addEventListener('dragenter', e => {
    if (![...e.dataTransfer.types].includes('Files')) return;
    dragDepth++;
    document.body.classList.add('is-drag');
});
window.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
window.addEventListener('dragleave', () => {
    if (--dragDepth > 0) return;
    dragDepth = 0;
    document.body.classList.remove('is-drag');
});
window.addEventListener('drop', async e => {
    e.preventDefault();
    dragDepth = 0;
    document.body.classList.remove('is-drag');
    // DataTransferItemList는 await 이후 비워지므로 먼저 동기적으로 꺼낸다.
    const entries = [...e.dataTransfer.items]
        .filter(it => it.kind === 'file')
        .map(it => it.webkitGetAsEntry && it.webkitGetAsEntry())
        .filter(Boolean);
    const plain = [...e.dataTransfer.files];

    if (!entries.length) { setLibrary(plain); return; }
    const out = [];
    await Promise.all(entries.map(en => walkEntry(en, out)));
    setLibrary(out.length ? out : plain);
});

// 디렉터리 엔트리를 재귀적으로 훑어 File 목록으로 만든다.
function walkEntry(entry, out) {
    return new Promise(resolve => {
        if (entry.isFile) {
            entry.file(f => { f._path = entry.fullPath; out.push(f); resolve(); }, () => resolve());
            return;
        }
        if (!entry.isDirectory) return resolve();
        const reader = entry.createReader();
        const found = [];
        const readMore = () => reader.readEntries(
            batch => {
                if (!batch.length) { Promise.all(found.map(c => walkEntry(c, out))).then(resolve); return; }
                found.push(...batch);
                readMore();
            },
            () => resolve()
        );
        readMore();
    });
}

/* ---------- 3. ID3v2 태그 (제목 · 아티스트 · 앨범아트) ---------- */

const synchsafe = (b, o) => (b[o] << 21) | (b[o + 1] << 14) | (b[o + 2] << 7) | b[o + 3];
const uint32    = (b, o) => (b[o] << 24) | (b[o + 1] << 16) | (b[o + 2] << 8) | b[o + 3];

async function readId3(file) {
    try {
        const head = new Uint8Array(await file.slice(0, 10).arrayBuffer());
        if (head.length < 10 || head[0] !== 0x49 || head[1] !== 0x44 || head[2] !== 0x33) return null;

        const major = head[3];
        if (major !== 3 && major !== 4) return null;      // v2.2 등은 파일명 규칙으로 대체
        const tagFlags = head[5];
        if (tagFlags & 0x80) return null;                 // unsynchronisation: 오프셋이 어긋나므로 포기
        const size = synchsafe(head, 6);
        if (size <= 0 || size > 24 * 1024 * 1024) return null;

        const buf = new Uint8Array(await file.slice(10, 10 + size).arrayBuffer());
        const out = {};

        let p = 0;
        if (tagFlags & 0x40) {                            // 확장 헤더 건너뛰기
            p = major === 4 ? synchsafe(buf, 0) : uint32(buf, 0) + 4;
            if (p <= 0 || p >= buf.length) return null;
        }

        while (p + 10 <= buf.length) {
            const id = String.fromCharCode(buf[p], buf[p + 1], buf[p + 2], buf[p + 3]);
            if (!/^[A-Z0-9]{4}$/.test(id)) break;                 // 패딩 영역 도달
            const fsize = major === 4 ? synchsafe(buf, p + 4) : uint32(buf, p + 4);
            const start = p + 10;
            if (fsize <= 0 || start + fsize > buf.length) break;

            // 압축·암호화·데이터길이표시 프레임은 원본 바이트가 아니므로 건너뛴다
            const odd = major === 4 ? (buf[p + 9] & 0x0F) : (buf[p + 9] & 0xC0);
            if (!odd) {
                const data = buf.subarray(start, start + fsize);
                if      (id === 'TIT2') out.title  = decodeFrameText(data);
                else if (id === 'TPE1') out.artist = decodeFrameText(data);
                else if (id === 'APIC' && !out.art) out.art = parsePicture(data, 10 + start);
            }
            p = start + fsize;
        }
        return out;
    } catch { return null; }
}

function decodeFrameText(d) {
    if (d.length < 2) return '';
    const enc  = d[0];
    const body = d.subarray(1);
    let label = 'utf-8';
    if (enc === 1)      label = (body[0] === 0xFE && body[1] === 0xFF) ? 'utf-16be' : 'utf-16le';
    else if (enc === 2) label = 'utf-16be';
    else if (enc === 3) label = 'utf-8';
    else {
        // ISO-8859-1로 선언돼 있어도 국내 파일은 EUC-KR인 경우가 흔하다.
        label = 'iso-8859-1';
        for (const b of body) if (b >= 0x80) { label = 'euc-kr'; break; }
    }
    let s;
    try { s = new TextDecoder(label).decode(body); }
    catch { s = new TextDecoder('utf-8').decode(body); }
    return s.replace(/\0/g, '').trim();
}

// APIC 프레임에서 이미지 데이터의 파일 내 위치만 기록한다(메모리 절약).
function parsePicture(d, fileBase) {
    const enc = d[0];
    let i = 1;
    let mime = '';
    while (i < d.length && d[i] !== 0) mime += String.fromCharCode(d[i++]);
    i++;                                         // mime 종료 null
    i++;                                         // picture type
    if (enc === 1 || enc === 2) {                // UTF-16 설명문은 null 2바이트로 끝난다
        while (i + 1 < d.length && !(d[i] === 0 && d[i + 1] === 0)) i += 2;
        i += 2;
    } else {
        while (i < d.length && d[i] !== 0) i++;
        i++;
    }
    if (i >= d.length) return null;

    mime = mime.trim().toLowerCase();
    mime = (mime === 'png' || mime === 'image/png') ? 'image/png' : 'image/jpeg';
    return { off: fileBase + i, len: d.length - i, mime };
}

/* ---------- 4. 백그라운드 스캔 (태그 → 재생시간) ---------- */

async function scanMetadata() {
    const token = ++scanToken;
    for (const [i, t] of tracks.entries()) {
        if (token !== scanToken) return;

        if (t.fileObj) {
            const tag = await readId3(t.fileObj);
            if (token !== scanToken) return;
            if (tag) {
                if (tag.title)  t.title  = tag.title;
                if (tag.artist) t.artist = tag.artist;
                if (tag.art)    t.art    = tag.art;
                updateRow(i);
                if (i === current) showNowPlaying(t);
            }
        }

        t.duration = await probeDuration(t.url);
        if (token !== scanToken) return;
        const cell = document.querySelector(`[data-dur="${i}"]`);
        if (cell && t.duration) cell.textContent = fmt(t.duration);
    }
}

function probeDuration(url) {
    return new Promise(resolve => {
        const a = new Audio();
        a.preload = 'metadata';
        const done = v => { a.src = ''; resolve(v); };
        a.addEventListener('loadedmetadata', () => done(a.duration));
        a.addEventListener('error', () => done(null));
        setTimeout(() => done(null), 8000);
        a.src = url;
    });
}

/* ---------- 5. 목록 ---------- */

function fmt(sec) {
    if (!isFinite(sec) || sec < 0) return '00:00';
    const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function rowHtml(t, i) {
    return `
        <div class="row-art" style="background:${t.tint}">${escapeHtml((t.title.charAt(0) || '♪').toUpperCase())}</div>
        <div class="row-body">
            <div class="row-title">${escapeHtml(t.title)}</div>
            <div class="row-artist">${escapeHtml(t.artist)}</div>
        </div>
        <div class="row-dur" data-dur="${i}">${t.duration ? fmt(t.duration) : '--:--'}</div>
        <button class="row-fav${favs.has(t.name) ? ' on' : ''}" data-fav="${i}" title="좋아요">
            <svg class="ic"><use href="#i-heart"/></svg>
        </button>`;
}

function renderList(filter = '') {
    const box = $('trackList');
    const q = filter.trim().toLowerCase();
    box.innerHTML = '';
    $('trackCount').textContent = tracks.length ? `${tracks.length}곡` : '';

    if (!tracks.length) {
        box.innerHTML = '<div class="empty">불러온 곡이 없습니다.</div>';
        return;
    }

    let shown = 0;
    tracks.forEach((t, i) => {
        if (q && !(t.title + ' ' + t.artist).toLowerCase().includes(q)) return;
        shown++;
        const row = document.createElement('div');
        row.className = 'row' + (i === current ? ' active' : '');
        row.dataset.index = i;
        row.innerHTML = rowHtml(t, i);
        row.addEventListener('click', e => {
            const fav = e.target.closest('[data-fav]');
            if (fav) { toggleFav(i); return; }
            play(i);
            showNow();
        });
        box.appendChild(row);
    });

    if (q && !shown) box.innerHTML = '<div class="empty">검색 결과가 없습니다.</div>';
}

// 스캔으로 제목·아티스트가 바뀐 행만 갱신한다(전체 재렌더 방지).
function updateRow(i) {
    const row = document.querySelector(`#trackList [data-index="${i}"]`);
    if (row) row.innerHTML = rowHtml(tracks[i], i);
}

function toggleFav(i) {
    const name = tracks[i].name;
    favs.has(name) ? favs.delete(name) : favs.add(name);
    updateRow(i);
    if (i === current) syncHeart();
}

function syncHeart() {
    const on = current >= 0 && favs.has(tracks[current].name);
    $('heartBtn').classList.toggle('on', on);
}

$('heartBtn').addEventListener('click', () => { if (current >= 0) toggleFav(current); });

/* ---------- 6. 재생 제어 ---------- */

function randomIndex(exclude = -1) {
    if (tracks.length <= 1) return 0;
    let i;
    do { i = Math.floor(Math.random() * tracks.length); } while (i === exclude);
    return i;
}

function setArt(url, tint) {
    if (artUrl) URL.revokeObjectURL(artUrl);
    artUrl = url;

    const art = $('art'), mArt = $('mArt'), bg = $('bg');
    art.querySelector('img')?.remove();
    mArt.innerHTML = '';

    if (tint) { art.style.background = tint; mArt.style.background = tint; }

    if (!url) {
        $('artIcon').style.display = '';
        bg.style.backgroundImage = '';
        bg.classList.remove('on');
        return;
    }
    $('artIcon').style.display = 'none';
    const img = new Image();  img.src = url;  img.alt = '';  art.appendChild(img);
    const mImg = new Image(); mImg.src = url; mImg.alt = ''; mArt.appendChild(mImg);
    bg.style.backgroundImage = `url("${url}")`;
    bg.classList.add('on');
}

function showNowPlaying(t) {
    $('npTitle').textContent  = t.title;
    $('npArtist').textContent = t.artist;
    $('mTitle').textContent   = t.title;
    $('mArtist').textContent  = t.artist;
    $('fmtBadge').textContent = t.fmt;
    document.title = `${t.title} — ${t.artist}`;
    syncHeart();

    if (t.art && t.fileObj) {
        const blob = t.fileObj.slice(t.art.off, t.art.off + t.art.len, t.art.mime);
        setArt(URL.createObjectURL(blob), t.tint);
    } else {
        setArt(null, t.tint);
    }
}

function resetNowPlaying() {
    $('npTitle').textContent  = '재생할 곡을 선택하세요';
    $('npArtist').textContent = '—';
    $('mTitle').textContent   = '—';
    $('mArtist').textContent  = '—';
    $('curTime').textContent  = '00:00';
    $('durTime').textContent  = '00:00';
    $('fmtBadge').textContent = '';
    $('progressFill').style.width = '0%';
    $('progressKnob').style.left  = '0%';
    document.title = 'Music Player';
    setArt(null, 'linear-gradient(150deg, #d9e2f6, #c6d2ec)');
    syncHeart();
}

// file:// 로 열었을 때 옆에 놓인 mp3는 브라우저가 교차 출처로 취급한다.
// 그 상태로 MediaElementSource에 물리면 출력이 무음이 되므로 분석기를 붙이지 않는다.
// (사용자가 직접 불러온 blob: 곡은 같은 출처라 안전하다.)
function canAnalyse() {
    if (current < 0) return false;
    return tracks[current].url.startsWith('blob:') || /^https?:$/.test(location.protocol);
}

function play(index) {
    if (!tracks.length) return;
    current = index;
    const t = tracks[index];
    audio.src = t.url;

    showNowPlaying(t);
    if (canAnalyse()) ensureAnalyser();
    audio.play().catch(err => console.warn('재생 실패:', err));
    renderList($('searchBox').value);
}

function togglePlay() {
    if (!tracks.length) { openFolder(); return; }
    if (current === -1) { play(randomIndex()); return; }   // 처음 누르면 랜덤 시작
    if (audio.paused) {
        if (canAnalyse()) ensureAnalyser();
        audio.play().catch(() => {});
    }
    else audio.pause();
}

/* 자동 재생: 브라우저가 막으면 첫 조작에서 시작되도록 대기한다. */
function beginPlayback() {
    play(shuffle ? randomIndex() : 0);
    setTimeout(() => { if (audio.paused) armFirstGesture(); }, 400);
}

function armFirstGesture() {
    toast('아무 곳이나 누르면 재생됩니다.');
    const start = e => {
        document.removeEventListener('pointerdown', start, true);
        document.removeEventListener('keydown', start, true);
        if (e.type === 'keydown') return;                      // 단축키 처리에 맡긴다
        if (e.target.closest('button, input, .progress')) return;   // 컨트롤은 스스로 처리
        if (audio.paused) togglePlay();
    };
    document.addEventListener('pointerdown', start, true);
    document.addEventListener('keydown', start, true);
}

function next() { if (tracks.length) play(shuffle ? randomIndex(current) : (current + 1) % tracks.length); }
function prev() { if (tracks.length) play(shuffle ? randomIndex(current) : (current - 1 + tracks.length) % tracks.length); }

function onEnded() {
    if (repeat === 'one') { audio.currentTime = 0; audio.play().catch(() => {}); return; }
    if (repeat === 'off') {
        // 반복 없음 — 순서 재생이면 목록 끝에서, 셔플이면 이번 곡에서 멈춘다
        if (shuffle || current === tracks.length - 1) return;
        play(current + 1);
        return;
    }
    next();
}

function setPlayIcon(playing) {
    const icon = playing ? '#i-pause' : '#i-play';
    $('playIcon').firstElementChild.setAttribute('href', icon);
    $('mPlayIcon').firstElementChild.setAttribute('href', icon);
    document.body.classList.toggle('playing', playing);
}

audio.addEventListener('play',  () => setPlayIcon(true));
audio.addEventListener('pause', () => setPlayIcon(false));
audio.addEventListener('ended', onEnded);
audio.addEventListener('loadedmetadata', () => { $('durTime').textContent = fmt(audio.duration); });
audio.addEventListener('timeupdate', () => {
    if (seeking) return;
    $('curTime').textContent = fmt(audio.currentTime);
    paintProgress(audio.duration ? audio.currentTime / audio.duration : 0);
});

function paintProgress(ratio) {
    const pct = Math.max(0, Math.min(1, ratio)) * 100;
    $('progressFill').style.width = pct + '%';
    $('progressKnob').style.left  = pct + '%';
}

/* 진행바: 클릭 + 드래그 탐색 */
let seeking = false;
const bar = $('progress');

function ratioAt(clientX) {
    const r = bar.getBoundingClientRect();
    return Math.max(0, Math.min(1, (clientX - r.left) / r.width));
}
bar.addEventListener('pointerdown', e => {
    if (!audio.duration) return;
    seeking = true;
    bar.setPointerCapture(e.pointerId);
    const v = ratioAt(e.clientX);
    paintProgress(v);
    $('curTime').textContent = fmt(v * audio.duration);
});
bar.addEventListener('pointermove', e => {
    if (!seeking) return;
    const v = ratioAt(e.clientX);
    paintProgress(v);
    $('curTime').textContent = fmt(v * audio.duration);
});
bar.addEventListener('pointerup', e => {
    if (!seeking) return;
    seeking = false;
    audio.currentTime = ratioAt(e.clientX) * audio.duration;
});
bar.addEventListener('pointercancel', () => { seeking = false; });

$('playBtn').addEventListener('click', togglePlay);
$('prevBtn').addEventListener('click', prev);
$('nextBtn').addEventListener('click', next);
$('mPlay').addEventListener('click', togglePlay);
$('mNext').addEventListener('click', next);
$('mPrev').addEventListener('click', prev);

$('shuffleBtn').addEventListener('click', () => {
    shuffle = !shuffle;
    $('shuffleBtn').classList.toggle('on', shuffle);
    toast(shuffle ? '셔플 켜짐' : '셔플 꺼짐');
});

const REPEAT_ORDER = ['all', 'one', 'off'];
const REPEAT_LABEL = { all: '전체 반복', one: '한 곡 반복', off: '반복 없음' };
$('repeatBtn').addEventListener('click', () => {
    repeat = REPEAT_ORDER[(REPEAT_ORDER.indexOf(repeat) + 1) % REPEAT_ORDER.length];
    $('repeatBtn').classList.toggle('on', repeat !== 'off');
    $('repeatBtn').classList.toggle('one', repeat === 'one');
    toast(REPEAT_LABEL[repeat]);
});

/* ---------- 7. 뷰 전환 · 검색 · 전체화면 ---------- */

const showList = () => document.body.classList.add('list-open');
const showNow  = () => document.body.classList.remove('list-open');

$('listBtn').addEventListener('click', showList);
$('collapseBtn').addEventListener('click', showList);
$('closeList').addEventListener('click', showNow);
$('miniMeta').addEventListener('click', showNow);

function openSearch() {
    showList();
    const box = $('searchBox');
    box.classList.remove('hidden-box');
    box.focus();
}
$('searchFab').addEventListener('click', openSearch);
$('searchBtn').addEventListener('click', () => {
    const box = $('searchBox');
    if (box.classList.contains('hidden-box')) { openSearch(); return; }
    box.classList.add('hidden-box');
    box.value = '';
    renderList();
});
$('searchBox').addEventListener('input', e => renderList(e.target.value));

$('fsBtn').addEventListener('click', () => {
    if (document.fullscreenElement) { document.exitFullscreen(); return; }
    const req = document.documentElement.requestFullscreen?.();
    if (req) req.catch(() => toast('전체화면을 열 수 없습니다.'));
    else toast('전체화면을 지원하지 않습니다.');
});

/* 커버 크기: 남은 세로 공간을 실측해 정한다.
   화면이 넉넉하면 정사각, 좁으면 그만큼 낮아져 아래 컨트롤이 잘리지 않는다. */
const viewNow  = document.querySelector('.view-now');
const artWrap  = document.querySelector('.art-wrap');
const spacerEl = document.querySelector('.spacer');

function fitArt() {
    let others = 0;
    for (const el of viewNow.children) {
        if (el === artWrap || el === spacerEl || el.classList.contains('fabs')) continue;
        others += el.offsetHeight;
    }
    const avail = viewNow.clientHeight - others - 6;   // 6 = .spacer 최소 높이
    const width = artWrap.clientWidth;
    if (width <= 0) return;
    $('art').style.height = Math.max(140, Math.min(width, avail)) + 'px';
}

window.addEventListener('resize', fitArt);
window.addEventListener('orientationchange', () => setTimeout(fitArt, 120));

document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.ctrlKey || e.altKey || e.metaKey) return;
    if (e.code === 'Space')      { e.preventDefault(); togglePlay(); }
    if (e.code === 'ArrowRight') next();
    if (e.code === 'ArrowLeft')  prev();
    if (e.code === 'KeyO')       openFolder();
    if (e.code === 'KeyL')       document.body.classList.toggle('list-open');
    if (e.code === 'Escape')     showNow();
});

/* ---------- 8. 토스트 ---------- */

let toastTimer = null;
function toast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

/* ---------- 9. 스펙트럼 ---------- */

const bars = [];
(function buildBars() {
    const wrap = $('wave');
    for (let i = 0; i < BAR_COUNT; i++) {
        const d = document.createElement('i');
        wrap.appendChild(d);
        bars.push(d);
    }
})();

let ctx = null, analyser = null, freq = null, source = null;
const level = new Float32Array(BAR_COUNT);   // 바별 현재 높이(감쇠용)

// AudioContext는 사용자 제스처 이후에만 생성/재개할 수 있다.
function ensureAnalyser() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    try {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        source = ctx.createMediaElementSource(audio);
        analyser = ctx.createAnalyser();
        analyser.fftSize = 256;                 // → 128 bins
        analyser.smoothingTimeConstant = 0.72;
        freq = new Uint8Array(analyser.frequencyBinCount);
        source.connect(analyser);
        analyser.connect(ctx.destination);
    } catch (err) {
        console.warn('오디오 분석 초기화 실패 (스펙트럼은 유휴 상태로 유지됩니다):', err);
        analyser = null;
    }
}

// 낮은 주파수에 바를 촘촘히 배치(로그 스케일)
const binRange = [];
(function mapBins() {
    const LOW = 1, HIGH = 84;
    for (let i = 0; i < BAR_COUNT; i++) {
        const a = Math.round(LOW * Math.pow(HIGH / LOW, i / BAR_COUNT));
        const b = Math.max(a + 1, Math.round(LOW * Math.pow(HIGH / LOW, (i + 1) / BAR_COUNT)));
        binRange.push([a, b]);
    }
})();

function tick() {
    requestAnimationFrame(tick);
    const active = analyser && !audio.paused && !audio.ended;

    if (active) {
        analyser.getByteFrequencyData(freq);
        // 전체 음폭(RMS)으로 스케일 → 조용한 구간에서는 스펙트럼도 작아진다
        let sum = 0;
        for (let i = 0; i < freq.length; i++) sum += freq[i] * freq[i];
        const rms = Math.sqrt(sum / freq.length) / 255;
        const gain = Math.min(1, rms * 2.6);

        for (let i = 0; i < BAR_COUNT; i++) {
            const [a, b] = binRange[i];
            let m = 0;
            for (let j = a; j < b && j < freq.length; j++) m += freq[j];
            m /= (b - a);
            const target = Math.min(100, 5 + (m / 255) * 118 * (0.45 + gain * 0.55));
            level[i] += (target - level[i]) * (target > level[i] ? 0.55 : 0.16);  // 빠른 어택 / 느린 릴리즈
        }
    } else {
        for (let i = 0; i < BAR_COUNT; i++) level[i] += (6 - level[i]) * 0.08;
    }

    for (let i = 0; i < BAR_COUNT; i++) bars[i].style.height = level[i].toFixed(1) + '%';
}
requestAnimationFrame(tick);

/* ---------- 10. 내장 오디오 ---------- */

// 문서 안에 base64로 들어 있는 곡을 File 객체로 되살린다.
// 되살린 뒤에는 원본 텍스트(수 MB)를 DOM에서 제거해 메모리를 돌려준다.
function loadEmbedded() {
    const nodes = [...document.querySelectorAll('script[data-embedded-audio]')];
    if (!nodes.length) return null;

    const files = [];
    for (const el of nodes) {
        try {
            const name = el.dataset.name || 'track.mp3';
            const mime = el.dataset.mime || 'audio/mpeg';
            const f = new File([base64ToBytes(el.textContent)], name, { type: mime });
            if (el.dataset.title)  f._title  = el.dataset.title;
            if (el.dataset.artist) f._artist = el.dataset.artist;
            files.push(f);
        } catch (err) {
            console.warn('내장 곡 복원 실패:', el.dataset.name, err);
        }
        el.remove();
    }
    return files.length ? files : null;
}

function base64ToBytes(text) {
    let b64 = text.trim();
    if (/\s/.test(b64)) b64 = b64.replace(/\s+/g, '');
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
}

/* ---------- 11. 문서에 심어둔 재생목록 ---------- */

// index.html 옆에 mp3를 두는 구성. fetch를 쓰지 않으므로 file:// 에서도 동작한다.
function readPlaylist() {
    const el = document.getElementById('playlist');
    if (!el) return null;
    try {
        const data = JSON.parse(el.textContent);
        if (!Array.isArray(data)) return null;
        const list = data
            .map(t => typeof t === 'string' ? { file: t } : t)
            .filter(t => t && typeof t.file === 'string' && AUDIO_EXT.test(t.file));
        return list.length ? list : null;
    } catch (err) {
        console.warn('재생목록을 읽지 못했습니다:', err);
        return null;
    }
}

/* ---------- 12. 시작 ---------- */

// http(s)로 열었을 때는 옆의 mp3/ 폴더를 먼저 시도하고,
// 실패하면(= file:// 로 연 경우 포함) 폴더 선택 화면을 띄운다.
async function autoLoadFromServer() {
    if (!/^https?:$/.test(location.protocol)) return false;

    let files = null;
    try {
        const res = await fetch(MP3_DIR + 'playlist.json', { cache: 'no-store' });
        if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data) && data.length) {
                files = data.map(t => typeof t === 'string' ? { file: t } : t);
            }
        }
    } catch { /* 없으면 디렉터리 목록으로 */ }

    if (!files) {
        try {
            const res = await fetch(MP3_DIR, { cache: 'no-store' });
            if (!res.ok) return false;
            const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
            const names = [...doc.querySelectorAll('a[href]')]
                .map(a => decodeURIComponent(a.getAttribute('href')).split('/').pop())
                .filter(h => AUDIO_EXT.test(h));
            if (!names.length) return false;
            files = [...new Set(names)].sort().map(f => ({ file: f }));
        } catch { return false; }
    }

    adoptPathTracks(files.map(f => ({ ...f, file: MP3_DIR + f.file })), { autostart: true });
    return true;
}

(async function init() {
    renderList();
    resetNowPlaying();
    requestAnimationFrame(fitArt);

    // 1) 문서에 심어둔 재생목록 (index.html 옆에 mp3를 두는 구성)
    const listed = readPlaylist();
    if (listed) { adoptPathTracks(listed, { autostart: true }); return; }

    // 2) 문서에 내장된 곡. 디코딩이 메인 스레드를 잠깐 잡으므로 첫 페인트 이후로 미룬다.
    if (document.querySelector('script[data-embedded-audio]')) {
        await new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
        const files = loadEmbedded();
        if (files) { setLibrary(files, { quiet: true, autostart: true }); return; }
        $('overlay').hidden = false;      // 복원에 실패하면 폴더 선택으로 되돌린다
        return;
    }

    // 3) http(s)로 열었다면 옆의 mp3/ 폴더를 스캔, 실패하면 폴더 선택 화면
    await autoLoadFromServer();
})();

})();
</script>
