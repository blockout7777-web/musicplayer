<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dbe3f5">
<title>QR 코드 만들기</title>
<style>
/* =========================================================
   URL → QR 코드 → PNG
   뮤직 플레이어와 같은 페리윙클 파스텔 · 파일 한 장
   ========================================================= */

:root {
    --ink:    #2b3040;
    --ink-2:  #656b7d;
    --ink-3:  #9aa0b0;
    --line:   rgba(43, 48, 64, .16);
    --card:   rgba(255, 255, 255, .58);
    --field:  rgba(255, 255, 255, .72);
    --bad:    #c0392f;
    --radius: 26px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { height: 100%; }

body {
    min-height: 100%;
    font-family: 'Pretendard', -apple-system, 'Segoe UI Variable', 'Segoe UI',
                 'Malgun Gothic', system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(165deg, #e4ebfa 0%, #cdd8ef 42%, #e7e4f4 100%);
    background-attachment: fixed;
    -webkit-tap-highlight-color: transparent;
    display: flex;
    justify-content: center;
    padding: 26px 16px 40px;
}

.stage {
    width: min(460px, 100%);
    display: flex;
    flex-direction: column;
    gap: 16px;
}

/* ---------- 머리말 ---------- */

header { text-align: center; padding: 6px 0 2px; }
header h1 { font-size: 21px; font-weight: 700; letter-spacing: -.4px; }
header p { margin-top: 6px; font-size: 13px; color: var(--ink-2); }

/* ---------- 카드 ---------- */

.card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: 0 22px 48px -30px rgba(40, 50, 85, .55),
                0 0 0 1px rgba(255, 255, 255, .5) inset;
    backdrop-filter: blur(3px);
}

/* ---------- 입력 ---------- */

.field {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--field);
    border: 1px solid transparent;
    border-radius: 16px;
    padding: 0 14px;
    transition: border-color .16s ease, background .16s ease;
}
.field:focus-within { border-color: rgba(43, 48, 64, .28); background: rgba(255, 255, 255, .88); }
.field svg { flex: none; opacity: .45; }

#url {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    background: none;
    font: inherit;
    font-size: 15px;
    color: var(--ink);
    padding: 14px 0;
}
#url::placeholder { color: var(--ink-3); }

.clear {
    flex: none;
    border: 0;
    background: none;
    padding: 6px;
    cursor: pointer;
    color: var(--ink-3);
    display: none;
    line-height: 0;
}
.clear.on { display: block; }
.clear:hover { color: var(--ink); }

.note {
    margin-top: 10px;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--ink-2);
    word-break: break-all;
    white-space: pre-line;
}
.note.bad { color: var(--bad); }
.note:empty { display: none; }

/* ---------- QR 화면 ---------- */

.preview {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 22px 18px;
}

.frame {
    width: min(300px, 100%);
    aspect-ratio: 1;
    border-radius: 20px;
    padding: 14px;                 /* 여백을 없애도 둥근 모서리에 잘리지 않도록 */
    background: #fff;
    display: grid;
    place-items: center;
    overflow: hidden;
    box-shadow: 0 14px 34px -22px rgba(40, 50, 85, .6);
}
.frame.empty { background: rgba(255, 255, 255, .38); }

#qr {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
}
#qr.hide { display: none; }

.placeholder {
    font-size: 13px;
    color: var(--ink-3);
    text-align: center;
    padding: 0 20px;
    line-height: 1.6;
}
.placeholder.hide { display: none; }

.meta { font-size: 12px; color: var(--ink-3); letter-spacing: .2px; height: 15px; }

/* ---------- 설정 ---------- */

.row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 11px 2px;
}
.row + .row { border-top: 1px solid var(--line); }
.row .label { font-size: 13.5px; font-weight: 600; }
.row .label small { display: block; font-weight: 400; font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }

.seg {
    display: flex;
    background: rgba(255, 255, 255, .55);
    border-radius: 12px;
    padding: 3px;
    flex: none;
}
.seg button {
    border: 0;
    background: none;
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-2);
    padding: 7px 11px;
    border-radius: 9px;
    cursor: pointer;
    transition: background .14s ease, color .14s ease;
}
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] {
    background: rgba(255, 255, 255, .95);
    color: var(--ink);
    box-shadow: 0 4px 10px -6px rgba(40, 50, 85, .6);
}

.colors { display: flex; gap: 8px; flex: none; }
.colors label {
    width: 34px; height: 34px;
    border-radius: 11px;
    overflow: hidden;
    position: relative;
    cursor: pointer;
    box-shadow: 0 0 0 1px var(--line) inset;
}
.colors input[type="color"] {
    position: absolute;
    inset: -6px;
    width: calc(100% + 12px);
    height: calc(100% + 12px);
    border: 0;
    padding: 0;
    background: none;
    cursor: pointer;
}

/* ---------- 버튼 ---------- */

.actions { display: flex; gap: 10px; }

.btn {
    flex: 1;
    border: 0;
    border-radius: 16px;
    padding: 15px 12px;
    font: inherit;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform .12s ease, box-shadow .16s ease, opacity .16s ease;
}
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .45; cursor: default; transform: none; }

.btn.primary {
    background: var(--ink);
    color: #fff;
    box-shadow: 0 16px 30px -18px rgba(40, 50, 85, .95);
}
.btn.ghost {
    flex: none;
    padding: 15px 18px;
    background: rgba(255, 255, 255, .72);
    color: var(--ink);
    box-shadow: 0 0 0 1px var(--line) inset;
}

footer { text-align: center; font-size: 11.5px; color: var(--ink-3); line-height: 1.7; }

@media (max-width: 380px) {
    .row { flex-direction: column; align-items: stretch; }
    .row .seg, .row .colors { align-self: flex-start; }
}
</style>
</head>
<body>

<div class="stage">

    <header>
        <h1>QR 코드 만들기</h1>
        <p>주소를 넣으면 QR 코드가 만들어집니다. PNG로 내려받으세요.</p>
    </header>

    <div class="card">
        <div class="field">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/>
                <path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>
            </svg>
            <input id="url" type="text" placeholder="https://example.com" autocomplete="off"
                   autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
            <button class="clear" id="clear" type="button" aria-label="지우기">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <path d="M18 6 6 18M6 6l12 12"/>
                </svg>
            </button>
        </div>
        <p class="note" id="note"></p>
    </div>

    <div class="card preview">
        <div class="frame empty" id="frame">
            <canvas id="qr" class="hide" width="1" height="1"></canvas>
            <p class="placeholder" id="placeholder">주소를 입력하면<br>여기에 QR 코드가 나타납니다</p>
        </div>
        <p class="meta" id="meta"></p>
    </div>

    <div class="card">
        <div class="row">
            <div class="label">오류 정정<small>높을수록 손상에 강하고 조밀해집니다</small></div>
            <div class="seg" id="ecc">
                <button type="button" data-v="L">L</button>
                <button type="button" data-v="M" aria-pressed="true">M</button>
                <button type="button" data-v="Q">Q</button>
                <button type="button" data-v="H">H</button>
            </div>
        </div>
        <div class="row">
            <div class="label">내려받을 크기<small>정사각형 PNG</small></div>
            <div class="seg" id="size">
                <button type="button" data-v="256">256</button>
                <button type="button" data-v="512" aria-pressed="true">512</button>
                <button type="button" data-v="1024">1024</button>
            </div>
        </div>
        <div class="row">
            <div class="label">여백<small>인쇄할 때는 4칸을 권장합니다</small></div>
            <div class="seg" id="quiet">
                <button type="button" data-v="0">없음</button>
                <button type="button" data-v="2">2칸</button>
                <button type="button" data-v="4" aria-pressed="true">4칸</button>
            </div>
        </div>
        <div class="row">
            <div class="label">색<small>어두운 칸 · 배경</small></div>
            <div class="colors">
                <label><input type="color" id="fg" value="#2b3040" aria-label="어두운 칸 색"></label>
                <label><input type="color" id="bg" value="#ffffff" aria-label="배경색"></label>
            </div>
        </div>
    </div>

    <div class="actions">
        <button class="btn primary" id="download" type="button" disabled>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3v12m0 0 4.5-4.5M12 15l-4.5-4.5"/>
                <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
            </svg>
            PNG로 내려받기
        </button>
        <button class="btn ghost" id="copy" type="button" disabled title="이미지를 클립보드로 복사">복사</button>
    </div>

    <footer>파일 한 장으로 동작합니다 · 입력한 주소는 어디로도 전송되지 않습니다</footer>

</div>

<script>
/* QR-CORE-START ------------------------------------------------------------
   QR 코드 인코더 (ISO/IEC 18004) — 8비트 바이트 모드, 버전 1~40, 정정 L/M/Q/H
   외부 라이브러리 없이 직접 구현
   ------------------------------------------------------------------------ */
const QR = (() => {

    /* 정정 수준별 · 버전별 블록당 오류정정 코드워드 수 (0번 자리는 사용 안 함) */
    const ECC_PER_BLOCK = {
        L: [-1, 7, 10, 15, 20, 26, 18, 20, 24, 30, 18, 20, 24, 26, 30, 22, 24, 28, 30, 28, 28, 28, 28, 30, 30, 26, 28, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
        M: [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26, 26, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28],
        Q: [-1, 13, 22, 18, 26, 18, 24, 18, 22, 20, 24, 28, 26, 24, 20, 30, 24, 28, 28, 26, 30, 28, 30, 30, 30, 30, 28, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
        H: [-1, 17, 28, 22, 16, 22, 28, 26, 26, 24, 28, 24, 28, 22, 24, 24, 30, 28, 28, 26, 28, 30, 24, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30]
    };

    /* 정정 수준별 · 버전별 블록 수 */
    const NUM_BLOCKS = {
        L: [-1, 1, 1, 1, 1, 1, 2, 2, 2, 2, 4, 4, 4, 4, 4, 6, 6, 6, 6, 7, 8, 8, 9, 9, 10, 12, 12, 12, 13, 14, 15, 16, 17, 18, 19, 19, 20, 21, 22, 24, 25],
        M: [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16, 17, 17, 18, 20, 21, 23, 25, 26, 28, 29, 31, 33, 35, 37, 38, 40, 43, 45, 47, 49],
        Q: [-1, 1, 1, 2, 2, 4, 4, 6, 6, 8, 8, 8, 10, 12, 16, 12, 17, 16, 18, 21, 20, 23, 23, 25, 27, 29, 34, 34, 35, 38, 40, 43, 45, 48, 51, 53, 56, 59, 62, 65, 68],
        H: [-1, 1, 1, 2, 4, 4, 4, 5, 6, 8, 8, 11, 11, 16, 16, 18, 16, 19, 21, 25, 25, 25, 34, 30, 32, 35, 37, 40, 42, 45, 48, 51, 54, 57, 60, 63, 66, 70, 74, 77, 81]
    };

    const FORMAT_BITS = { L: 1, M: 0, Q: 3, H: 2 };
    const PENALTY = { N1: 3, N2: 3, N3: 40, N4: 10 };

    /* ---------- 갈루아체 GF(256) 연산 ---------- */

    function gfMul(x, y) {
        let z = 0;
        for (let i = 7; i >= 0; i--) {
            z = (z << 1) ^ ((z >>> 7) * 0x11D);
            z ^= ((y >>> i) & 1) * x;
        }
        return z & 0xFF;
    }

    /* 리드-솔로몬 생성 다항식 */
    function rsDivisor(degree) {
        const result = new Uint8Array(degree);
        result[degree - 1] = 1;
        let root = 1;
        for (let i = 0; i < degree; i++) {
            for (let j = 0; j < degree; j++) {
                result[j] = gfMul(result[j], root);
                if (j + 1 < degree) result[j] ^= result[j + 1];
            }
            root = gfMul(root, 0x02);
        }
        return result;
    }

    /* 나머지 = 오류정정 코드워드 */
    function rsRemainder(data, divisor) {
        const result = new Uint8Array(divisor.length);
        for (const b of data) {
            const factor = b ^ result[0];
            result.copyWithin(0, 1);
            result[result.length - 1] = 0;
            for (let i = 0; i < divisor.length; i++) result[i] ^= gfMul(divisor[i], factor);
        }
        return result;
    }

    /* ---------- 용량 계산 ---------- */

    /* 기능 패턴을 뺀, 데이터가 들어갈 수 있는 모듈 수 */
    function rawDataModules(ver) {
        let result = (16 * ver + 128) * ver + 64;
        if (ver >= 2) {
            const numAlign = Math.floor(ver / 7) + 2;
            result -= (25 * numAlign - 10) * numAlign - 55;
            if (ver >= 7) result -= 36;
        }
        return result;
    }

    /* 데이터 코드워드 수 */
    function dataCodewords(ver, ecl) {
        return Math.floor(rawDataModules(ver) / 8) - ECC_PER_BLOCK[ecl][ver] * NUM_BLOCKS[ecl][ver];
    }

    /* 바이트 모드 문자 수 지시자의 비트 길이 */
    const countBits = ver => ver <= 9 ? 8 : 16;

    /* ---------- 데이터 → 코드워드 ---------- */

    function encodeData(bytes, ver, ecl) {
        const bits = [];
        const push = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };

        push(0b0100, 4);                 /* 8비트 바이트 모드 */
        push(bytes.length, countBits(ver));
        for (const b of bytes) push(b, 8);

        const capacity = dataCodewords(ver, ecl) * 8;
        push(0, Math.min(4, capacity - bits.length));      /* 종단부 */
        push(0, (8 - bits.length % 8) % 8);                /* 바이트 경계 맞춤 */
        for (let pad = 0xEC; bits.length < capacity; pad ^= 0xEC ^ 0x11) push(pad, 8);

        const words = new Uint8Array(bits.length / 8);
        bits.forEach((bit, i) => words[i >>> 3] |= bit << (7 - (i & 7)));
        return words;
    }

    /* 블록별 오류정정 부호를 붙이고 규격대로 뒤섞는다 */
    function addEccAndInterleave(data, ver, ecl) {
        const numBlocks = NUM_BLOCKS[ecl][ver];
        const eccLen = ECC_PER_BLOCK[ecl][ver];
        const rawCodewords = Math.floor(rawDataModules(ver) / 8);
        const numShort = numBlocks - rawCodewords % numBlocks;
        const shortDataLen = Math.floor(rawCodewords / numBlocks) - eccLen;

        const divisor = rsDivisor(eccLen);
        const blocks = [];
        for (let i = 0, k = 0; i < numBlocks; i++) {
            const len = shortDataLen + (i < numShort ? 0 : 1);
            const dat = Array.from(data.slice(k, k + len));
            k += len;
            const ecc = rsRemainder(dat, divisor);
            if (i < numShort) dat.push(0);            /* 자리 맞춤용 가짜 바이트 */
            blocks.push(dat.concat(Array.from(ecc)));
        }

        const result = [];
        for (let i = 0; i < blocks[0].length; i++) {
            for (let j = 0; j < blocks.length; j++) {
                if (i !== shortDataLen || j >= numShort) result.push(blocks[j][i]);
            }
        }
        return result;
    }

    /* ---------- 모듈 배치 ---------- */

    function alignmentPositions(ver) {
        if (ver === 1) return [];
        const num = Math.floor(ver / 7) + 2;
        const step = ver === 32 ? 26 : Math.ceil((ver * 4 + 4) / (num * 2 - 2)) * 2;
        const pos = [6];
        for (let p = ver * 4 + 10; pos.length < num; p -= step) pos.splice(1, 0, p);
        return pos;
    }

    function makeMatrix(ver, ecl, codewords) {
        const size = ver * 4 + 17;
        const modules = Array.from({ length: size }, () => new Array(size).fill(false));
        const fixed = Array.from({ length: size }, () => new Array(size).fill(false));

        const setFn = (x, y, dark) => {
            if (x < 0 || y < 0 || x >= size || y >= size) return;
            modules[y][x] = dark;
            fixed[y][x] = true;
        };
        const bit = (v, i) => ((v >>> i) & 1) !== 0;

        /* 타이밍 패턴 */
        for (let i = 0; i < size; i++) { setFn(6, i, i % 2 === 0); setFn(i, 6, i % 2 === 0); }

        /* 파인더 패턴 + 분리자 */
        for (const [cx, cy] of [[3, 3], [size - 4, 3], [3, size - 4]]) {
            for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
                const d = Math.max(Math.abs(dx), Math.abs(dy));
                setFn(cx + dx, cy + dy, d !== 2 && d !== 4);
            }
        }

        /* 정렬 패턴 */
        const align = alignmentPositions(ver);
        for (let i = 0; i < align.length; i++) for (let j = 0; j < align.length; j++) {
            const corner = (i === 0 && j === 0) || (i === 0 && j === align.length - 1) || (i === align.length - 1 && j === 0);
            if (corner) continue;
            for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
                setFn(align[j] + dx, align[i] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
            }
        }

        /* 버전 정보 (7 이상) */
        if (ver >= 7) {
            let rem = ver;
            for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
            const bits = ver << 12 | rem;
            for (let i = 0; i < 18; i++) {
                const dark = bit(bits, i), a = size - 11 + i % 3, b = Math.floor(i / 3);
                setFn(a, b, dark);
                setFn(b, a, dark);
            }
        }

        const drawFormat = mask => {
            const data = FORMAT_BITS[ecl] << 3 | mask;
            let rem = data;
            for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
            const bits = (data << 10 | rem) ^ 0x5412;
            for (let i = 0; i <= 5; i++) setFn(8, i, bit(bits, i));
            setFn(8, 7, bit(bits, 6));
            setFn(8, 8, bit(bits, 7));
            setFn(7, 8, bit(bits, 8));
            for (let i = 9; i < 15; i++) setFn(14 - i, 8, bit(bits, i));
            for (let i = 0; i < 8; i++) setFn(size - 1 - i, 8, bit(bits, i));
            for (let i = 8; i < 15; i++) setFn(8, size - 15 + i, bit(bits, i));
            setFn(8, size - 8, true);                  /* 항상 어두운 모듈 */
        };
        drawFormat(0);

        /* 데이터 비트를 지그재그로 채운다 */
        let i = 0;
        for (let right = size - 1; right >= 1; right -= 2) {
            if (right === 6) right = 5;
            for (let vert = 0; vert < size; vert++) {
                for (let j = 0; j < 2; j++) {
                    const x = right - j;
                    const upward = ((right + 1) & 2) === 0;
                    const y = upward ? size - 1 - vert : vert;
                    if (!fixed[y][x] && i < codewords.length * 8) {
                        modules[y][x] = bit(codewords[i >>> 3], 7 - (i & 7));
                        i++;
                    }
                }
            }
        }

        /* 마스크 적용 · 벌점이 가장 낮은 것을 고른다 */
        const maskFn = [
            (x, y) => (x + y) % 2 === 0,
            (x, y) => y % 2 === 0,
            (x, y) => x % 3 === 0,
            (x, y) => (x + y) % 3 === 0,
            (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0,
            (x, y) => x * y % 2 + x * y % 3 === 0,
            (x, y) => (x * y % 2 + x * y % 3) % 2 === 0,
            (x, y) => ((x + y) % 2 + x * y % 3) % 2 === 0
        ];
        const applyMask = mask => {
            for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
                if (!fixed[y][x] && maskFn[mask](x, y)) modules[y][x] = !modules[y][x];
            }
        };

        let best = 0, bestScore = Infinity;
        for (let mask = 0; mask < 8; mask++) {
            applyMask(mask);
            drawFormat(mask);
            const score = penalty(modules, size);
            if (score < bestScore) { bestScore = score; best = mask; }
            applyMask(mask);                            /* 원상 복구 */
        }
        applyMask(best);
        drawFormat(best);

        return { size, modules, version: ver, ecl, mask: best };
    }

    /* ---------- 마스크 벌점 ---------- */

    function penalty(modules, size) {
        let result = 0;

        /* 파인더 패턴을 닮은 1:1:3:1:1 배열을 찾는다 */
        const countPatterns = h => {
            const n = h[1];
            const core = n > 0 && h[2] === n && h[3] === n * 3 && h[4] === n && h[5] === n;
            return (core && h[0] >= n * 4 && h[6] >= n ? 1 : 0) + (core && h[6] >= n * 4 && h[0] >= n ? 1 : 0);
        };
        const addHistory = (len, h) => {
            if (h[0] === 0) len += size;                /* 처음은 밝은 여백이 붙은 셈 */
            h.pop();
            h.unshift(len);
        };
        const terminate = (color, len, h) => {
            if (color) { addHistory(len, h); len = 0; }
            addHistory(len + size, h);
            return countPatterns(h);
        };

        for (const byRow of [true, false]) {
            for (let a = 0; a < size; a++) {
                let color = false, run = 0;
                const history = [0, 0, 0, 0, 0, 0, 0];
                for (let b = 0; b < size; b++) {
                    const m = byRow ? modules[a][b] : modules[b][a];
                    if (m === color) {
                        run++;
                        if (run === 5) result += PENALTY.N1;
                        else if (run > 5) result++;
                    } else {
                        addHistory(run, history);
                        if (!color) result += countPatterns(history) * PENALTY.N3;
                        color = m;
                        run = 1;
                    }
                }
                result += terminate(color, run, history) * PENALTY.N3;
            }
        }

        /* 2×2 같은 색 덩어리 */
        for (let y = 0; y < size - 1; y++) for (let x = 0; x < size - 1; x++) {
            const c = modules[y][x];
            if (c === modules[y][x + 1] && c === modules[y + 1][x] && c === modules[y + 1][x + 1]) result += PENALTY.N2;
        }

        /* 밝고 어두운 모듈의 균형 */
        let dark = 0;
        for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (modules[y][x]) dark++;
        const total = size * size;
        const k = Math.ceil(Math.abs(dark * 20 - total * 10) / total) - 1;
        return result + k * PENALTY.N4;
    }

    /* ---------- 공개 함수 ---------- */

    /* 최대 용량 (바이트) */
    function maxBytes(ecl) {
        return dataCodewords(40, ecl) - 3;              /* 모드 4비트 + 문자 수 16비트 */
    }

    /* 문자열 → { size, modules[][], version, ecl, mask } */
    function encode(text, ecl = 'M') {
        if (!ECC_PER_BLOCK[ecl]) throw new Error('알 수 없는 오류 정정 수준: ' + ecl);
        const bytes = new TextEncoder().encode(text);
        if (bytes.length === 0) throw new Error('내용이 비어 있습니다.');

        let ver = 0;
        for (let v = 1; v <= 40; v++) {
            if (4 + countBits(v) + bytes.length * 8 <= dataCodewords(v, ecl) * 8) { ver = v; break; }
        }
        if (!ver) throw new Error('내용이 너무 깁니다.');

        return makeMatrix(ver, ecl, addEccAndInterleave(encodeData(bytes, ver, ecl), ver, ecl));
    }

    return { encode, maxBytes };
})();
/* QR-CORE-END ----------------------------------------------------------- */


/* =========================================================================
   화면
   ========================================================================= */
(() => {
    const $ = id => document.getElementById(id);
    const input = $('url'), note = $('note'), meta = $('meta'), frame = $('frame');
    const canvas = $('qr'), placeholder = $('placeholder');
    const btnDownload = $('download'), btnCopy = $('copy'), btnClear = $('clear');

    const opt = { ecc: 'M', size: 512, quiet: 4, fg: '#2b3040', bg: '#ffffff' };
    let current = null;          /* 마지막으로 그린 { text, qr } */

    /* ---------- 입력 다듬기 ---------- */

    /* 앞에 스킴이 없는 도메인 꼴이면 https:// 를 붙여 준다 */
    const DOMAIN = /^[\w-]+(\.[\w-]+)+([/:?#].*)?$/;
    function normalize(raw) {
        const text = raw.trim();
        if (!text) return '';
        if (/^[a-z][a-z0-9+.-]*:/i.test(text)) return text;      /* http:, mailto:, tel: … */
        return DOMAIN.test(text) ? 'https://' + text : text;
    }

    /* ---------- 그리기 ---------- */

    function render() {
        const raw = input.value;
        btnClear.classList.toggle('on', raw.length > 0);

        const text = normalize(raw);
        if (!text) return clear('');

        const limit = QR.maxBytes(opt.ecc);
        const bytes = new TextEncoder().encode(text).length;
        if (bytes > limit) {
            return clear(`내용이 너무 깁니다 — ${bytes.toLocaleString()}바이트, 정정 ${opt.ecc} 수준의 한계는 ${limit.toLocaleString()}바이트입니다.`, true);
        }

        let qr;
        try {
            qr = QR.encode(text, opt.ecc);
        } catch (err) {
            return clear(err.message, true);
        }

        current = { text, qr };
        draw(qr, opt.size);

        canvas.classList.remove('hide');
        placeholder.classList.add('hide');
        frame.classList.remove('empty');
        frame.style.background = opt.bg;
        meta.textContent = `버전 ${qr.version} · ${qr.size}×${qr.size} 칸 · 정정 ${opt.ecc}`;

        const notes = [];
        if (text !== raw.trim()) notes.push(`인코딩된 주소 — ${text}`);
        if (opt.quiet === 0) notes.push('여백이 없으면 스캐너가 못 읽을 수 있습니다. 코드 둘레에 밝은 공간을 두세요.');
        note.textContent = notes.join('\n');
        note.classList.remove('bad');
        btnDownload.disabled = btnCopy.disabled = false;
    }

    /* 여백을 포함한 정사각형으로, 칸 경계가 정수 픽셀에 떨어지도록 그린다 */
    function draw(qr, target) {
        const total = qr.size + opt.quiet * 2;
        const scale = Math.max(1, Math.round(target / total));
        const px = total * scale;

        canvas.width = canvas.height = px;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = opt.bg;
        ctx.fillRect(0, 0, px, px);
        ctx.fillStyle = opt.fg;
        for (let y = 0; y < qr.size; y++) for (let x = 0; x < qr.size; x++) {
            if (qr.modules[y][x]) {
                ctx.fillRect((x + opt.quiet) * scale, (y + opt.quiet) * scale, scale, scale);
            }
        }
    }

    function clear(message, bad = false) {
        current = null;
        canvas.classList.add('hide');
        placeholder.classList.remove('hide');
        frame.classList.add('empty');
        frame.style.background = '';
        meta.textContent = '';
        note.textContent = message;
        note.classList.toggle('bad', bad);
        btnDownload.disabled = btnCopy.disabled = true;
    }

    /* ---------- 내려받기 ---------- */

    /* 주소에서 파일 이름을 만든다 — qr-example-com.png */
    function filename(text) {
        let name = text.replace(/^[a-z][a-z0-9+.-]*:\/*/i, '').split(/[/?#]/)[0];
        name = name.replace(/[^\w.-]+/g, '-').replace(/^-+|-+$/g, '').replace(/\./g, '-').slice(0, 48);
        return 'qr-' + (name || 'code') + '.png';
    }

    btnDownload.addEventListener('click', () => {
        if (!current) return;
        const link = document.createElement('a');
        link.download = filename(current.text);
        link.href = canvas.toDataURL('image/png');
        link.click();
    });

    btnCopy.addEventListener('click', async () => {
        if (!current) return;
        const label = btnCopy.textContent;
        try {
            const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
            await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
            btnCopy.textContent = '복사됨';
        } catch {
            btnCopy.textContent = '실패';
        }
        setTimeout(() => { btnCopy.textContent = label; }, 1400);
    });

    /* ---------- 조작 ---------- */

    for (const [id, key, cast] of [['ecc', 'ecc', String], ['size', 'size', Number], ['quiet', 'quiet', Number]]) {
        $(id).addEventListener('click', e => {
            const btn = e.target.closest('button');
            if (!btn) return;
            for (const b of $(id).querySelectorAll('button')) b.setAttribute('aria-pressed', String(b === btn));
            opt[key] = cast(btn.dataset.v);
            render();
        });
    }

    for (const id of ['fg', 'bg']) {
        $(id).addEventListener('input', e => { opt[id] = e.target.value; render(); });
    }

    let timer = 0;
    input.addEventListener('input', () => {
        clearTimeout(timer);
        timer = setTimeout(render, 120);
    });
    input.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !btnDownload.disabled) { clearTimeout(timer); render(); btnDownload.click(); }
    });

    btnClear.addEventListener('click', () => { input.value = ''; input.focus(); render(); });

    /* 주소 뒤에 ?text=… 또는 #… 을 붙이면 그 값으로 시작한다 */
    let preset = new URLSearchParams(location.search).get('text');
    if (!preset && location.hash.length > 1) {
        try { preset = decodeURIComponent(location.hash.slice(1)); }
        catch { preset = location.hash.slice(1); }
    }
    if (preset) input.value = preset;
    render();
    input.focus();
})();
</script>

</body>
